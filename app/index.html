<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090817">
    <title>Neon Hours — Poster Studio</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Neon Hours Poster Studio">
        <span class="brand-mark">NH</span>
        <span class="brand-type"><strong>NEON HOURS</strong><small>POSTER STUDIO</small></span>
      </a>
      <div class="privacy"><i></i> PRIVATE <span>·</span> ON YOUR DEVICE</div>
    </header>

    <main class="workspace">
      <aside class="controls">
        <div class="intro">
          <p class="eyebrow">MAKE THE NIGHT YOURS</p>
          <h1>Own the<br><em>afterglow.</em></h1>
          <p class="intro-copy">Three frames. One night. Your story.</p>
        </div>

        <section class="control-section">
          <h2><span>01</span> Your scenes</h2>
          <label class="dropzone" for="photo-files">
            <span class="upload-mark" aria-hidden="true">＋</span>
            <span><strong>Choose photos</strong><small>Local images · never uploaded</small></span>
            <input id="photo-files" type="file" accept="image/*" multiple>
          </label>
          <div id="photo-chips" class="photo-chips" aria-live="polite"></div>
          <div class="scene-selects">
            <label>MAIN<select id="photo-main"></select></label>
            <label>MID<select id="photo-mid"></select></label>
            <label>CLOSE<select id="photo-close"></select></label>
          </div>
        </section>

        <section class="control-section">
          <h2><span>02</span> Reframe</h2>
          <div class="panel-tabs" role="group" aria-label="Panel to reframe">
            <button type="button" class="active" data-panel="main">MAIN</button>
            <button type="button" data-panel="mid">MID</button>
            <button type="button" data-panel="close">CLOSE</button>
          </div>
          <label class="range-control"><span>ZOOM <output id="zoom-value">1.00×</output></span>
            <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1">
          </label>
          <div class="range-pair">
            <label class="range-control"><span>X OFFSET</span><input id="pan-x" type="range" min="-100" max="100" step="1" value="0"></label>
            <label class="range-control"><span>Y OFFSET</span><input id="pan-y" type="range" min="-100" max="100" step="1" value="0"></label>
          </div>
        </section>

        <section class="control-section statement-section">
          <h2><span>03</span> Make a statement</h2>
          <label class="sr-only" for="headline">Poster headline</label>
          <input id="headline" class="headline-input" type="text" maxlength="32" value="MIDNIGHT HEAT">
          <div class="presets">
            <button type="button" data-caption="AFTER THE LAST CALL">AFTER THE LAST CALL</button>
            <button type="button" data-caption="NEVER LOOK BACK">NEVER LOOK BACK</button>
          </div>
        </section>

        <section class="control-section export-section">
          <h2><span>04</span> Export</h2>
          <label class="sr-only" for="format">Poster format</label>
          <select id="format" class="format-select">
            <option value="square">SQUARE · 1080×1080</option>
            <option value="portrait">PORTRAIT · 1080×1350</option>
            <option value="wide">WIDE · 1920×1080</option>
          </select>
          <button id="export" class="export-button" type="button">EXPORT PNG <span>↗</span></button>
          <p id="export-status" class="status" role="status">Your photo stays on this device.</p>
        </section>
      </aside>

      <section class="preview" aria-label="Poster preview">
        <div class="preview-bar"><span><i></i> LIVE POSTER</span><output id="canvas-size">1080 × 1080</output></div>
        <div class="canvas-frame"><canvas id="poster" width="1080" height="1080" aria-label="Neon Hours poster preview"></canvas></div>
        <p class="preview-note">A little more night. A lot more you.</p>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
